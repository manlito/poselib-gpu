# The Python package (bindings/python). pip and the wheel builds use scikit-build-core, which runs the CMake
# build with the options below. The CUDA packages (poselib-gpu-cu12, poselib-gpu-cu13) are built from this
# file after packaging/variant.py has rewritten their name and CMake options.

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind==3.1.0", "numpy>=1.26"]  # numpy: the stub generation imports poselib_gpu
build-backend = "scikit_build_core.build"

[project]
name = "poselib-gpu"
dynamic = ["version"]
description = "Batched robust relative and absolute pose (PnP) for calibrated cameras, ported from PoseLib, with Metal and CUDA kernels"
readme = "bindings/python/README.md"
requires-python = ">=3.12"
# This repository's code is Apache-2.0; the solvers ported from PoseLib stay BSD-3-Clause.
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSE.PoseLib"]
dependencies = ["numpy>=1.26"]
keywords = ["relative pose", "PnP", "RANSAC", "structure from motion", "PoseLib", "GPU"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Documentation = "https://poselib-gpu.pages.dev"
Source = "https://github.com/manlito/poselib-gpu"
PoseLib = "https://github.com/PoseLib/PoseLib"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
# One wheel per platform for every Python from 3.12 (stable ABI).
wheel.py-api = "cp312"
wheel.packages = ["bindings/python/poselib_gpu"]
sdist.exclude = ["CLAUDE.md", "build", "docs", "web", "tools", "third_party", "RESULTS.md", "wheelhouse", "dist", ".github", ".claude", "bindings/python/.venv"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(poselib_gpu VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
JPO_BUILD_PYTHON = "ON"
JPO_BUILD_TESTS = "OFF"
JPO_BUILD_CLI = "OFF"
JPO_BUILD_WASM = "OFF"
JPO_INSTALL = "OFF"
JPO_REFERENCE = "OFF"
JPO_WEBGPU = "OFF"
JPO_CUDA = "OFF"
JPO_PACKAGE_VARIANT = "cpu"

# Wheels: built by .github/workflows/release.yml on every push to main. One abi3 wheel per platform, tested
# with the Python tests. The CUDA packages add their settings in the workflow (CIBW_* variables).
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest -q {project}/bindings/python/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# The Metal backend's kernels are compiled at run time; macOS 13 as just-ba's wheels.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
